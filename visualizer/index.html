<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>AST Візуалізація</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; }
        .node circle { fill: #fff; stroke: #4682b4; stroke-width: 3px; }
        .node text { font: 16px sans-serif; pointer-events: none; }
        .link { fill: none; stroke: #ccc; stroke-width: 2px; }
        #tree-container { display: flex; justify-content: center; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Абстрактне синтаксичне дерево (AST)</h2>
    <div id="tree-container"></div>

    <script>
        const width = 800;
        const height = 500;
        const margin = { top: 40, right: 90, bottom: 50, left: 90 };
        const astFilePath = "../build/Release/ast.json"; 

        const svg = d3.select("#tree-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        d3.json(astFilePath).then(data => {
            const root = d3.hierarchy(data);
            const treeLayout = d3.tree().size([width - margin.left - margin.right, height - margin.top - margin.bottom]);
            
            treeLayout(root);

            svg.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkVertical()
                    .x(d => d.x)
                    .y(d => d.y)
                );

            const node = svg.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.x},${d.y})`);

            node.append("circle").attr("r", 20);

            node.append("text")
                .attr("dy", 5)
                .attr("text-anchor", "middle")
                .text(d => d.data.name);
        }).catch(error => {
            console.error("Помилка завантаження ast.json. Переконайтеся, що файл існує і ви використовуєте локальний сервер.", error);
            d3.select("#tree-container").html("<p style='color:red;'>Помилка: Не вдалося завантажити ast.json. Запустіть сторінку через локальний веб-сервер (наприклад, Live Server).</p>");
        });
    </script>
</body>
</html>
